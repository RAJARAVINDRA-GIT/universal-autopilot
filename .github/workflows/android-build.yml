name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q universal-autopilot-apk-ready.zip -d extracted
          test -f extracted/universal-autopilot/gradlew
          test -f extracted/universal-autopilot/settings.gradle.kts

      - name: Patch Android compatibility and BOB/UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("extracted/universal-autopilot")

          p = root / "platform/src/main/java/com/universal/autopilot/platform/notifications/AutopilotNotificationListener.kt"
          s = p.read_text()
          old = "val inputs = action.remoteInputs ?: emptyArray()"
          new = "val inputs = (action.remoteInputs ?: emptyArray()).map { input: android.app.RemoteInput ->\n    RemoteInput.Builder(input.resultKey).setLabel(input.label).setChoices(input.choices).setAllowFreeFormInput(input.allowFreeFormInput).addExtras(input.extras).build()\n}.toTypedArray()"
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)

          p = root / "app/src/main/java/com/universal/autopilot/service/AutopilotService.kt"
          s = p.read_text()
          s = s.replace("import androidx.lifecycle.LifecycleService", "import android.app.Service")
          s = s.replace("import androidx.lifecycle.lifecycleScope", "")
          s = s.replace("import kotlinx.coroutines.delay", "import kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport kotlinx.coroutines.delay")
          s = s.replace("class AutopilotService : LifecycleService()", "class AutopilotService : Service()")
          s = s.replace("    @Inject lateinit var hud: HudController", "    @Inject lateinit var hud: HudController\n\n    private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)")
          s = s.replace("lifecycleScope.launch", "serviceScope.launch")
          s = s.replace("        super.onDestroy()", "        serviceScope.cancel()\n        super.onDestroy()", 1)
          s = s.replace("        super.onBind(intent)", "        return null")
          p.write_text(s)

          p = root / "app/src/main/java/com/universal/autopilot/ui/bob/BobViewModel.kt"
          s = p.read_text()
          s = s.replace("runtime.addChat(BobMessage(UUID.randomUUID().toString(), BobRole.USER, text))\\n            val history = chat.value", "val userMessage = BobMessage(UUID.randomUUID().toString(), BobRole.USER, text)\\n            runtime.addChat(userMessage)\\n            val history = chat.value + userMessage")
          p.write_text(s)

          p = root / "app/src/main/java/com/universal/autopilot/bob/BobBrain.kt"
          s = p.read_text()
          marker = '            "takeover" in lower || "overlay" in lower ->\\n                "Enable overlay + accessibility + notification listener. Then I fly the HUD over every app."'
          addition = marker + ',\\n            "who are you" in lower || "what are you" in lower ->\\n                "I’m BOB, your Android autopilot assistant. I can handle rules, notifications, drafts, and device actions.",\\n            "help" in lower ->\\n                "Try /rule for automation, /sum com.whatsapp for a digest, or ask a normal question.",\\n            "draft" in lower || "reply" in lower ->\\n                "Tell me the app, recipient, and tone. I’ll prepare a draft without sending it.",\\n            lower.endsWith("?") ->\\n                "I received your question, but the AI link is offline. Add an API key in Settings for full natural-language answers."'
          if marker in s: s=s.replace(marker, addition, 1)
          s=s.replace('json.decodeFromString<ChatResponse>(payload).choices.firstOrNull()?.message?.content ?: fallback', 'if (!response.isSuccessful) fallback else json.decodeFromString<ChatResponse>(payload).choices.firstOrNull()?.message?.content?.takeIf { it.isNotBlank() } ?: fallback')
          p.write_text(s)

          p = root / "core/src/main/java/com/universal/autopilot/core/ui/theme/Theme.kt"
          s = p.read_text().replace("val Glass = Color(0x66101828)", "val Glass = Color(0xE6141C2E)")
          s = s.replace("        lineHeight = 20.sp,\\n    ),", "        lineHeight = 20.sp,\\n        color = Color(0xFFF4FAFF),\\n    ),")
          p.write_text(s)

          p = root / "app/src/main/java/com/universal/autopilot/ui/bob/BobScreen.kt"
          s = p.read_text()
          s = s.replace("import androidx.compose.ui.Modifier\\n", "import androidx.compose.ui.Modifier\\nimport androidx.compose.ui.graphics.Color\\n")
          s = s.replace("Text(draft.body)", "Text(draft.body, color = Color(0xFFF4FAFF))")
          s = s.replace("Text(msg.content)", "Text(msg.content, color = Color(0xFFF4FAFF))")
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: extracted/universal-autopilot
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-autopilot-apk
          path: extracted/universal-autopilot/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
