name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q universal-autopilot-apk-ready.zip -d extracted
          test -f extracted/universal-autopilot/gradlew
          test -f extracted/universal-autopilot/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: extracted/universal-autopilot
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-autopilot-apk
          path: extracted/universal-autopilot/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
