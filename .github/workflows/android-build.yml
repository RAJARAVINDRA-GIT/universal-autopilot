name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q universal-autopilot-apk-ready.zip -d extracted
          test -f extracted/universal-autopilot/gradlew
          test -f extracted/universal-autopilot/settings.gradle.kts

      - name: Patch RemoteInput compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/universal-autopilot/platform/src/main/java/com/universal/autopilot/platform/notifications/AutopilotNotificationListener.kt")
          s = p.read_text()
          old = "val inputs = action.remoteInputs ?: emptyArray()"
          new = "val inputs = (action.remoteInputs ?: emptyArray()).map(RemoteInput::fromCompat).toTypedArray()"
          if old not in s:
              raise SystemExit("Expected RemoteInput line was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: extracted/universal-autopilot
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-autopilot-apk
          path: extracted/universal-autopilot/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
