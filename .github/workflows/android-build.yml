name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q universal-autopilot-apk-ready.zip -d extracted
          test -f extracted/universal-autopilot/gradlew
          test -f extracted/universal-autopilot/settings.gradle.kts

      - name: Patch Android compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix Android RemoteInput -> AndroidX RemoteInput conversion.
          p = Path("extracted/universal-autopilot/platform/src/main/java/com/universal/autopilot/platform/notifications/AutopilotNotificationListener.kt")
          s = p.read_text()
          old = "val inputs = action.remoteInputs ?: emptyArray()"
          new = """val inputs = (action.remoteInputs ?: emptyArray()).map { input: android.app.RemoteInput ->
              RemoteInput.Builder(input.resultKey)
                  .setLabel(input.label)
                  .setChoices(input.choices)
                  .setAllowFreeFormInput(input.allowFreeFormInput)
                  .addExtras(input.extras)
                  .build()
          }.toTypedArray()"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Hilt supports Service directly. Replace LifecycleService with Service
          # and provide an equivalent coroutine scope for the existing work.
          p = Path("extracted/universal-autopilot/app/src/main/java/com/universal/autopilot/service/AutopilotService.kt")
          s = p.read_text()
          s = s.replace("import androidx.lifecycle.LifecycleService\n", "import android.app.Service\n")
          s = s.replace("import androidx.lifecycle.lifecycleScope\n", "")
          s = s.replace("import kotlinx.coroutines.delay\n", "import kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.cancel\nimport kotlinx.coroutines.delay\n")
          s = s.replace("class AutopilotService : LifecycleService() {", "class AutopilotService : Service() {")
          s = s.replace("    @Inject lateinit var hud: HudController\n", "    @Inject lateinit var hud: HudController\n\n    private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)\n")
          s = s.replace("lifecycleScope.launch", "serviceScope.launch")
          s = s.replace("        super.onDestroy()\n", "        serviceScope.cancel()\n        super.onDestroy()\n", 1)
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: extracted/universal-autopilot
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-autopilot-apk
          path: extracted/universal-autopilot/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
